[project]
name = "wingfoil-lab"
version = "0.1.0"
description = "Algorithm tuning ground for the WingFoil apps (parse real FITs, tune detectors, freeze goldens)"
requires-python = ">=3.11"
dependencies = [
    "fitdecode>=0.10.0",
    "fit-tool>=0.9.13",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0"]
notebooks = ["jupyterlab>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wingfoil_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
