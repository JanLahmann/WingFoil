# Deploy web/ to GitHub Pages.
#
# The web app is deliberately static: Pyodide runs the actual wingfoil_lab Python in the
# browser, so there is nothing to build here — no bundler, no node, no server. The only
# guard worth running is the one that matters: lab_bundle/wingfoil_lab must be the same
# code as lab/src/wingfoil_lab, or the site would silently analyze with a stale engine.
# bundle_lab.py --check compares source hashes and fails the deploy on drift.
#
# The same argument applies to the presentation values: web/css/tokens.css and
# web/js/tokens.js are generated from design/tokens.json, and deploying a site whose
# tokens no longer match the source would ship colours the iOS app does not have. So
# check_tokens.py --check runs beside it, before the upload.
#
# The checks run on a **pull request** as well as on the push that deploys. `bundle_lab.py`
# and `check_tokens.py` guard *generated* files, but most of the web's own KPI logic lives
# in `lab_bundle/library.py` and `lab_bundle/web_entry.py`, which are hand-written glue
# excluded from the manifest by design — nothing hashed them and nothing ran their guards.
# The three `verify_*.py` scripts are what actually pin the period rules, the record kinds
# and the rate arithmetic, so they run here too, in the lab's own uv environment. A stale
# bundle or a moved label used to fail at deploy time, on main, after the merge.
name: Deploy web to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "lab/src/wingfoil_lab/**"
      - "design/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "lab/**"
      - "design/**"
      - "fixtures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Everything that can say "no". Runs on a pull request as well as on main, so a stale
  # bundle, a moved token or a broken presentation rule fails before the merge rather than
  # at deploy time. `deploy` needs it, so a red check never ships.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle staleness check
        run: python web/tools/bundle_lab.py --check
      - name: Design token staleness check
        run: python design/check_tokens.py --check
      # The three verifiers need the engine itself — numpy, the FIT parser, the corpus — so
      # they run under the lab's own locked environment rather than a bare interpreter.
      # `verify_presentation` also shells out to `node` for `card_parity.mjs`, which the
      # runner has; without it that section skips rather than fails.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Presentation contract
        run: uv run --project lab python web/tools/verify_presentation.py
      - name: Library rules
        run: uv run --project lab python web/tools/verify_library.py
      - name: Web entry point
        run: uv run --project lab python web/tools/verify_web_entry.py

  deploy:
    # Push to main and manual runs only: a pull request has nothing to deploy to, and the
    # Pages environment is a single live site.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
