<meta charset="utf-8">

<title>Moved &middot; CleanJibe</title>
<!-- A REDIRECT STUB, and nothing else. *What's new* is the second half of *Get the beta*.
     A page that moved and left nothing behind is a link somebody sent a friend in March
     that now answers 404, so the address stays and says where the page went.

     `http-equiv="refresh"` with 0 seconds rather than a server rule, because this site is
     static files on GitHub Pages and has no server to write a rule in. `noindex` so the
     two addresses do not compete in a search result, and a `canonical` that names the one
     that is real. The link under the sentence is what a reader with JavaScript off, or a
     browser that refuses the refresh, actually uses.

     No site nav and no footer here on purpose: web/tools/verify_links.py skips a redirect
     for both, because a page that is on screen for a frame is not a page a reader
     navigates from. -->
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/start/#whats-new">
<link rel="canonical" href="https://cleanjibe.org/start/#whats-new">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/home.css">
</head>

        The release notes are the foot of Get started. <a href="/start/#whats-new">Read them there</a>.
      </p>
    </div>
  </section>
</main>

</body>
</html>
