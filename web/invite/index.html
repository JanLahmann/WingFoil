<title>Moved &middot; CleanJibe</title>
<!-- A REDIRECT STUB, and nothing else. *Get the beta* folded into *Get started* on
     20 September 2026: the install links and the walkthrough were two destinations for one
     job, and a reader met both before he had either app.

     THE ADDRESS STAYS BECAUSE IT IS IN EVERY TESTFLIGHT MAIL WE HAVE SENT, and in the
     iPhone app's own "Coming in a future release" screen. A page that moved and left
     nothing behind is a link that now answers 404.

     `http-equiv="refresh"` with 0 seconds rather than a server rule, because this site is
     static files on GitHub Pages and has no server to write a rule in. `noindex` so the two
     addresses do not compete in a search result, and a `canonical` that names the one that
     is real. The link under the sentence is what a reader with JavaScript off, or a browser
     that refuses the refresh, actually uses.

     No site nav and no footer here on purpose: web/tools/verify_links.py skips a redirect
     for both, because a page that is on screen for a frame is not a page a reader
     navigates from. -->
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=/start/#apps">
<link rel="canonical" href="https://cleanjibe.org/start/#apps">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/home.css">
</head>

<main>

    <div class="hero-copy">
      <h1>This page moved</h1>
      <p class="lede">
        The install links are the first section of Get started.
        <a href="/start/#apps">Get the apps there</a>.
      </p>
    </div>
  </section>
</main>

</body>
</html>
