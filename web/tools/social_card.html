<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CleanJibe social card</title>
<!--
  SOURCE for web/social-card.png — the 1200x630 Open Graph tile both documents point at.
  This file is never served: it exists so the tile can be regenerated instead of being an
  opaque binary nobody can edit. See web/README.md "The social card" for the two commands
  (headless Chrome screenshot, then a 256-colour quantize that takes it 187 KB -> 66 KB).

  Everything below is copied from the site rather than invented: the palette is
  design/tokens.json as css/style.css names it, and the track motif is the homepage hero's
  own SVG, geometry unchanged. Values are inlined rather than @imported because the
  screenshot must not depend on a server being up.
-->
<style>
  /* Values lifted from web/css/tokens.css + web/css/style.css — the same ink the site
     paints with, so the tile and the page are one design. */
  :root {
    --surface-0: #101010;
    --surface-1: #1a1a19;
    --line:      #333331;
    --line-soft: #2a2a29;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-3:     #8a8a80;
    --series-1:  #3987e5;
    --foil:      #40c8e0;   /* wf-phase-flying   */
    --track:     #97979d;   /* wf-phase-off-foil */
    --good:      #0ca30c;   /* wf-outcome-flew      */
    --warn:      #fab219;   /* wf-outcome-touchdown */
    --bad:       #d03b3b;   /* wf-outcome-fell-in   */
    --dir:       #c3c2b7;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--surface-0);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1200px; height: 630px;
    padding: 68px 72px 60px;
    display: flex; flex-direction: column; justify-content: space-between;
    background:
      radial-gradient(120% 140% at 12% 0%, #16232a 0%, #131313 58%, #101010 100%);
    position: relative;
    overflow: hidden;
  }
  /* A hairline of the brand blue along the top edge, the same one the topbar mark uses. */
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
    background: linear-gradient(90deg, var(--series-1), var(--foil) 55%, #0ca30c 100%);
    opacity: 0.85;
  }

  /* ------------------------------------------------------------- wordmark */
  .brand { display: flex; align-items: center; gap: 24px; }
  .mark { width: 84px; height: 84px; flex: none; display: block; }
  .wordmark { display: flex; flex-direction: column; gap: 10px; }
  h1 {
    font-size: 86px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
  }
  .eyebrow {
    font: 600 16px/1 var(--mono);
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
    display: flex; align-items: center; gap: 12px;
  }
  .eyebrow .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--foil);
    box-shadow: 0 0 0 4px #40c8e02e;
  }

  /* ---------------------------------------------------------------- motif */
  .motif {
    border: 1px solid var(--line-soft); border-radius: 16px;
    background: radial-gradient(120% 140% at 12% 0%, #16232a 0%, var(--surface-1) 60%);
    padding: 26px 28px 20px;
  }
  .motif svg { display: block; width: 100%; height: auto; }
  .m-track { fill: none; stroke: var(--track); stroke-width: 3; opacity: .55;
             stroke-linecap: round; stroke-linejoin: round; }
  .m-foil  { fill: none; stroke: var(--foil); stroke-width: 5;
             stroke-linecap: round; stroke-linejoin: round; }
  .m-dir   { fill: none; stroke: var(--dir); stroke-width: 2; opacity: .45;
             stroke-linecap: round; stroke-linejoin: round; }
  .m-flew  { fill: var(--good); stroke: var(--surface-1); stroke-width: 2; }
  .m-touch { fill: var(--warn); stroke: var(--surface-1); stroke-width: 2; }
  .m-fell  { fill: none; stroke: var(--bad); stroke-width: 3.5; stroke-linecap: round; }
  .key {
    display: flex; gap: 30px; margin-top: 18px;
    font: 400 18px/1 var(--sans); color: var(--ink-3);
  }
  .key span { display: inline-flex; align-items: center; gap: 10px; }
  .key i { width: 13px; height: 13px; border-radius: 50%; background: currentColor; }
  .k-foil  { color: var(--foil); }
  .k-flew  { color: var(--good); }
  .k-touch { color: var(--warn); }
  .k-fell  { color: var(--bad); }

  /* ---------------------------------------------------------------- foot */
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
  .tagline { font-size: 30px; line-height: 1.3; color: var(--ink-2); max-width: 810px; }
  .tagline b { color: var(--ink); font-weight: 650; }
  .url {
    font: 600 20px/1 var(--mono); color: var(--ink-3); white-space: nowrap;
    padding-bottom: 6px;
  }
</style>
</head>
<body>
<div class="card">

  <div class="brand">
    <!-- the site favicon, icons/icon.svg, verbatim -->
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

        </linearGradient>
        <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2EE6A8"/><stop offset="1" stop-color="#B9FF66"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="22" fill="#0A1E30"/>

            stroke="url(#tg)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(25.12,28.64) rotate(-30) scale(0.51) translate(-50,-36)">
        <path d="M 50 20 Q 74 22 92 46 Q 70 38 58 42 Q 52 44 50 52 Q 48 44 42 42 Q 30 38 8 46 Q 26 22 50 20 Z" fill="url(#wg)"/>
        <line x1="50" y1="23" x2="50" y2="49" stroke="#0A1E30" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      </g>
    </svg>
    <div class="wordmark">
      <h1>CleanJibe</h1>
      <p class="eyebrow"><span class="dot"></span>Watch · phone · browser · open source</p>
    </div>
  </div>

  <!-- The homepage hero's motif, geometry unchanged (web/index.html) — the same generated
       path strings, character for character, so a diff of the two files catches drift. -->
  <div class="motif">
    <svg viewBox="0 0 640 128">
      <path class="m-track" d="M24 118L243 102L264 100Q267 100 269 101Q271 102 271 104Q272 105 272 107Q271 110 269 111Q267 112 265 112Q262 112 260 111L241 100Q236 97 231 97L185 94L164 92Q161 92 159 93Q157 94 157 96Q156 97 156 99Q157 102 159 103Q161 104 163 104Q166 104 168 103L187 92Q192 89 197 89L415 73L436 71Q439 71 441 72Q443 73 443 75Q444 76 444 78Q443 81 441 82Q439 83 437 83Q434 83 432 82L413 71Q408 68 403 68L357 65L336 63Q333 63 331 64Q329 65 329 67Q328 68 328 70Q329 73 331 74Q333 75 335 75Q338 75 340 74L359 63Q364 60 369 60L608 42Q616 41 611 39L563 33Q553 32 543 31L264 10"/>
      <path class="m-foil" d="M24 118L243 102L264 100Q267 100 269 101Q271 102 271 104Q272 105 272 107Q271 110 269 111Q267 112 265 112Q262 112 260 111L241 100Q236 97 231 97L185 94L164 92Q161 92 159 93Q157 94 157 96Q156 97 156 99Q157 102 159 103Q161 104 163 104Q166 104 168 103L187 92Q192 89 197 89L415 73L436 71Q439 71 441 72Q443 73 443 75Q444 76 444 78Q443 81 441 82Q439 83 437 83Q434 83 432 82L413 71Q408 68 403 68L357 65L336 63Q333 63 331 64Q329 65 329 67Q328 68 328 70Q329 73 331 74Q333 75 335 75Q338 75 340 74L359 63Q364 60 369 60L608 42"/>

        <path d="M-4 -5 L2 0 L-4 5" transform="translate(150,120)"/>

      </g>
      <circle class="m-flew" cx="264" cy="92" r="7"/>
      <circle class="m-flew" cx="336" cy="55" r="7"/>

      <g class="m-fell">
        <path d="M602 36 L614 48"/><path d="M614 36 L602 48"/>
      </g>
    </svg>
    <p class="key">
      <span class="k-foil"><i></i>on the foil</span>
      <span class="k-flew"><i></i>flew through</span>
      <span class="k-touch"><i></i>touched down</span>
      <span class="k-fell"><i></i>fell in</span>
    </p>
  </div>

  <div class="foot">
    <p class="tagline">Open wingfoil tracking —<br><b>what your session actually did.</b></p>
    <p class="url">cleanjibe.org</p>
  </div>

</div>
</body>
</html>
