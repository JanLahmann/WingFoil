# XcodeGen project definition — the source of truth for ios/WingFoil.xcodeproj.
# The .xcodeproj itself is generated and gitignored; regenerate it with:
#
#     brew install xcodegen        # once
#     cd ios && xcodegen generate  # writes WingFoil.xcodeproj + WingFoil/Info.plist
#
# Then open ios/WingFoil.xcodeproj in Xcode and run the "WingFoil" scheme.

name: WingFoil

options:
  bundleIdPrefix: de.lahmann
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.42.0"

packages:
  WingFoilKit:
    path: WingFoilKit
  # Garmin's companion SDK: a binary xcframework (ObjC, device+simulator) that talks to
  # Garmin Connect Mobile, which is the only process allowed near the watch's BLE link.
  #
  # It is a dependency of the APP TARGET ONLY, never of WingFoilKit — see
  # WingFoilKit/Sources/WingFoilKit/Companion/CompanionLink.swift. The kit stays buildable
  # and testable on a machine with no framework and no watch; only the thin adapter that
  # actually calls `ConnectIQ.sharedInstance()` lives behind the app's import.
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    from: 1.8.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  WingFoil:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WingFoil
        excludes:
          - "Info.plist"          # generated below; not part of the compile sources group
          - "WingFoil.entitlements"
    dependencies:
      - package: WingFoilKit
        product: WingFoilKit
      - package: ConnectIQ
        product: ConnectIQ
      - target: WingFoilWidgets
        embed: true
      # The watch app ships inside the phone app's bundle. `embed: true` is what puts it
      # there; without it the target builds and installs nothing.
      - target: WingFoilWatch
        embed: true
    settings:
      base:
        PRODUCT_NAME: WingFoil
        # Required by the ConnectIQ xcframework: it is Objective-C and its categories are
        # invisible to the linker without it, which shows up as a runtime selector crash
        # rather than a build error.
        OTHER_LDFLAGS: "-ObjC"
        PRODUCT_BUNDLE_IDENTIFIER: de.lahmann.wingfoil
        MARKETING_VERSION: "0.15.0"
        CURRENT_PROJECT_VERSION: "26"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 685X8YLYSB         # Jan-Rainer Lahmann (personal + program team)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
      configs:
        # Release (what `archive` builds) signs manually with the App Store profile, like the
        # watch widgets: every embedded binary must carry the same certificate as its parent,
        # and the export re-signs with these same profiles (ios/ExportOptions.plist).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "WingFoil App Store"
    # Apple Health is opt-in in both directions — writing our sessions out (Settings → Apple
    # Health) and reading Apple Workout-app recordings in (Import → Apple Health, ADR-017).
    # The entitlement has to exist at build time even though nothing happens until the rider
    # asks. `healthkit.access` stays empty: that array is for *clinical records*, which this
    # app neither reads nor wants.
    #
    # NOT here, deliberately: `com.apple.developer.healthkit.background-delivery`. It is what
    # `HKHealthStore.enableBackgroundDelivery` needs to actually wake the app, and the manual
    # "WingFoil App Store" provisioning profile does not carry it — requesting an entitlement a
    # profile does not grant fails the archive, which is exactly the trap ADR-011 documents for
    # the widget's app group. So the app asks anyway and accepts the refusal
    # (`HealthImporter.observeNewWorkouts`), and the check at launch and foreground is what
    # actually gets a session in. Turning the wake on for real is configuration, not code: add
    # HealthKit → Background Delivery to the app id, regenerate the profile, and add the key
    # below.
    entitlements:
      path: WingFoil/WingFoil.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: WingFoil/Info.plist
      properties:
        NSHealthUpdateUsageDescription: >-
          Adds your wingfoil sessions to the Health app as workouts. CleanJibe only writes
          workouts you already imported; it never reads your health data.
        # Reading is opt-in too, and only ever the workouts the rider asks for: Import →
        # Apple Health lists Surfing / Water Sports / Sailing workouts, fetches the route and
        # heart rate of the ones he picks, and analyses them on this phone (ADR-017). Same
        # tone as the write string above, and the same promise underneath it — nothing about
        # a workout leaves the device.
        NSHealthShareUsageDescription: >-
          Imports sessions you recorded with Apple's Workout app: their GPS route and heart
          rate, so CleanJibe can analyse them. Everything stays on this phone; CleanJibe never
          uploads your health data.
        # The phone never asks for location — this string exists for the WATCH. watchOS
        # stores a companion watch app's location permission under the iPhone app, and since
        # watchOS 10 the watch simply never shows its own prompt when this key is missing
        # here: no error, `.notDetermined` forever, "Asking for location" on the start screen
        # for a whole session, and a recording with heart rate and zero fixes (4 Sep 2026,
        # ADR-019). Keep it in step with the watch target's string below.
        NSLocationWhenInUseUsageDescription: >-
          Records your track and speed on your Apple Watch while you ride. CleanJibe uses the
          watch's GPS only during a session you started, and the recording is sent straight
          to this phone. The phone itself never tracks your location.
        # The end-of-recording sheet's "Save to Photos" (App/PhotoLibrarySaver.swift). ADD
        # ONLY: the app asks for `.addOnly` authorization and can never read an asset back,
        # which is why there is no `NSPhotoLibraryUsageDescription` beside it. The photos a
        # rider splices into a clip come from `PhotosPicker`, which runs out of process and
        # needs no permission at all — so this is the only photo-library prompt the app has.
        NSPhotoLibraryAddUsageDescription: >-
          Saves the replay clip you just recorded to your photo library. CleanJibe only adds
          videos you ask it to save; it never reads your photos.
        # THE HOME-SCREEN NAME, and the one the rider reads everywhere the system names us:
        # the springboard, Settings → Notifications, the share sheet, the Health source list.
        # The brand is CleanJibe; the target, the module and every bundle id underneath stay
        # `WingFoil`/`de.lahmann.wingfoil.*`, which are identifiers nobody reads — renaming
        # them would orphan the TestFlight build, the BGTask registration and the keychain.
        #
        # Also read by the ConnectIQ SDK itself when it hands control to Garmin Connect
        # Mobile — GCM shows this name to the rider. It must exist, or device selection
        # comes back empty with no error anywhere.
        CFBundleDisplayName: CleanJibe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # --- phase 5, companion link (docs/decisions.md ADR-013) ---
        # Without this entry `canOpenURL` returns false for Garmin Connect Mobile even
        # when it is installed, and the SDK concludes there is no path to the watch.
        LSApplicationQueriesSchemes:
          - gcm-ciq
        # The way back from GCM: the rider picks a watch there, GCM reopens us on this
        # scheme, and `ConnectIQ.parseDeviceSelectionResponse` reads the devices out of
        # the URL. Nothing else in the app answers on it.
        CFBundleURLTypes:
          - CFBundleURLName: de.lahmann.wingfoil.ciq
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - wingfoil-ciq
        # iOS demands both strings from any app whose process touches Bluetooth, and the
        # SDK does on our behalf. Real sentences, not placeholders: TestFlight review
        # rejects the build otherwise, and the rider deserves to know why we are asking.
        NSBluetoothAlwaysUsageDescription: >-
          CleanJibe uses Bluetooth to receive a session summary from your Garmin watch the
          moment you stop recording, and to send the wind direction back to it. All of it
          goes through the Garmin Connect app; CleanJibe never pairs with anything itself.
        NSBluetoothPeripheralUsageDescription: >-
          CleanJibe uses Bluetooth to exchange session summaries and wind direction with
          your Garmin watch through the Garmin Connect app.
        ITSAppUsesNonExemptEncryption: false
        # --- new-session notifications (App/ActivityNotifier.swift) ---
        # The phone polls intervals.icu on a BGAppRefreshTask and posts a local
        # notification for an activity it has not seen. Both keys are load-bearing:
        # without `fetch` the scheduler refuses to submit the request, and an identifier
        # missing from the permitted list is a launch-time exception the moment
        # `BGTaskScheduler.register` is called.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - de.lahmann.wingfoil.refresh
        # Storyboard-free launch screen: the tile mark centred on the brand navy, so the
        # cold-start frame is the app's own colour instead of a white flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        # FIT has no system UTI; importing it makes .fit files pickable in the Files
        # importer and lets the share sheet hand recordings to the app.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: de.lahmann.wingfoil.fit
            UTTypeDescription: FIT activity file
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - fit
              public.mime-type:
                - application/vnd.ant.fit
          # GPX has no system-declared type on iOS either (engine 0.9.0). Imported, not
          # exported: the format is topografix.com's, not ours, and claiming to own it
          # would be wrong even though we are the only app on the phone that declares it.
          # It conforms to public.xml as well as public.data — a GPX *is* XML, and saying
          # so is what lets "Open in" offer CleanJibe for a file another app wrote.
          - UTTypeIdentifier: de.lahmann.wingfoil.gpx
            UTTypeDescription: GPX track file
            UTTypeConformsTo:
              - public.xml
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        CFBundleDocumentTypes:
          - CFBundleTypeName: Activity recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - de.lahmann.wingfoil.fit
              - de.lahmann.wingfoil.gpx
              - public.zip-archive
    scheme:
      environmentVariables:
        # Flip "enabled" on in Xcode (Edit Scheme → Run → Arguments) to sync without
        # typing the key into the app. DEBUG builds only.
        - variable: ICU_API_KEY
          value: ""
          isEnabled: false

  # Home-screen widgets: last session + this week's foil time.
  #
  # NO APP GROUP ENTITLEMENT. The manual "WingFoil App Store" provisioning profile does
  # not carry `group.de.lahmann.wingfoil`, and requesting an entitlement a profile does
  # not grant fails the archive — which would break the TestFlight path for a widget.
  # `WidgetSnapshotStore` therefore probes the shared container at runtime and falls back
  # to the app's own container, where the widget cannot see it: with today's profile the
  # widget installs and renders its "finish setting up" state.
  #
  # To turn the widget on for real (docs/decisions.md):
  #   1. Add the App Groups capability with `group.de.lahmann.wingfoil` to BOTH app ids
  #      in the developer portal, and regenerate "WingFoil App Store" plus a new profile
  #      for `de.lahmann.wingfoil.widgets`.
  #   2. Add `com.apple.security.application-groups` to both `entitlements` blocks here.
  #   3. Add the widget's bundle id to ios/ExportOptions.plist.
  # No code change is needed — the store starts finding the shared suite on its own.
  WingFoilWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WingFoilWidgets
      # The snapshot *format* is shared source rather than a linked library: the widget
      # would otherwise pull GRDB, the FIT parser and ZIPFoundation into a 30 MB-limited
      # extension in order to decode a few hundred bytes of JSON.
      - path: WingFoilKit/Sources/WingFoilKit/Presentation/WidgetSnapshot.swift
        group: Shared
    settings:
      base:
        PRODUCT_NAME: WingFoilWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.lahmann.wingfoil.widgets
        MARKETING_VERSION: "0.15.0"
        CURRENT_PROJECT_VERSION: "26"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 685X8YLYSB
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
      configs:
        # Release (what `archive` builds) signs manually with the App Store profile, like the
        # watch widgets: every embedded binary must carry the same certificate as its parent,
        # and the export re-signs with these same profiles (ios/ExportOptions.plist).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "WingFoil Widgets App Store"
    info:
      path: WingFoilWidgets/Info.plist
      properties:
        # The name the widget gallery prints above both widgets. Same brand, same reason as
        # the app's — the extension's own bundle id stays `de.lahmann.wingfoil.widgets`.
        CFBundleDisplayName: CleanJibe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The Apple Watch recorder (ios/WingFoilWatch/).
  #
  # RECORDER ONLY, BY DESIGN. It captures GPS + heart rate + a 50 Hz wrist accelerometer and
  # hands the phone a `.cjw` container over `WCSession.transferFile`; every number the rider
  # eventually reads is computed by WingFoilKit's analysis engine on the phone. There is no
  # flight, turn or record detection on the wrist and there must not be a second one — see
  # docs/watch-session-schema.md.
  #
  # ONE COMPLICATION, AND IT CLAIMS ALMOST NOTHING (docs/decisions.md ADR-018). The MVP shipped
  # without one on the grounds that a complication would be a fourth surface making claims about
  # a session; `WingFoilWatchWidgets` is not that. It is a launcher — the mark, and a `widgetURL`
  # that has the recorder running before the app has finished appearing — and the only session
  # facts it will ever print are the three the watch measured itself. No jibe count, no foil
  # percentage: ADR-016 still holds, and those numbers exist only on the phone.
  #
  # DEPLOYMENT TARGET 11.0. Every Apple Watch Apple currently sells — Series 10 and 11,
  # Ultra 2 and 3, SE 3 — runs watchOS 11 or later (Ultra 2 shipped on 10 and updates past
  # it), so this costs no watch on sale today and buys back two generations riders already
  # own. Nothing in the recorder needs a newer API: `@Observable` is watchOS 10,
  # `HKLiveWorkoutBuilder` is watchOS 5, and `enableWaterLock()` is watchOS 4. Building
  # against the 26.5 SDK, so raising it later is a one-line change, not a port.
  WingFoilWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    dependencies:
      # The complication ships inside the watch app, exactly as the watch app ships inside the
      # phone app. `embed: true` is again what puts it there.
      - target: WingFoilWatchWidgets
        embed: true
    sources:
      - path: WingFoilWatch
        excludes:
          - "Info.plist"
      # Two constants both sides of the complication have to agree on: the `cleanjibe://start`
      # URL, and the shape of the last-session snapshot. They live in `ios/WatchShared/` rather
      # than in either target's own directory for the mechanical reason `Views/WatchBrand.swift`
      # documents — a file inside a target's source tree that a second target also compiles gets
      # one group-relative reference filed at two depths, and the deeper one resolves to a path
      # that does not exist. No target claims `WatchShared/`, so both can have it.
      - path: WatchShared
        group: Shared
      # SHARED SOURCE, NOT A LINKED LIBRARY — the same arrangement `WingFoilWidgets` uses for
      # `WidgetSnapshot.swift`, and for the same reason. Linking WingFoilKit would drag GRDB,
      # FitFileParser and ZIPFoundation onto a wrist in order to write four floats at a time.
      # `WatchSessionContainer.swift` depends on Foundation and nothing else precisely so it
      # can be compiled into both sides of the transfer, which is what guarantees the writer
      # and the reader can never disagree about the format.
      #
      # The brand palette is NOT shared this way, and the reason is mechanical rather than a
      # matter of taste: `WingFoil/App/Brand.swift` already sits inside the WingFoil target's
      # own source tree, so XcodeGen emits one file reference with a group-relative path and
      # puts it in two groups at different depths — the second one resolves to
      # `WingFoil/App/WingFoil/App/Brand.swift` and the build fails on a missing input. The
      # WatchImport file above has no such problem because no target claims its directory.
      # The watch therefore carries its own five colours in `Views/WatchBrand.swift`, which
      # names `design/tokens.json` as the source of truth.
      - path: WingFoilKit/Sources/WingFoilKit/WatchImport/WatchSessionContainer.swift
        group: Shared
    settings:
      base:
        PRODUCT_NAME: WingFoilWatch
        PRODUCT_BUNDLE_IDENTIFIER: de.lahmann.wingfoil.watchkitapp
        MARKETING_VERSION: "0.15.0"
        CURRENT_PROJECT_VERSION: "26"
        TARGETED_DEVICE_FAMILY: "4"          # Apple Watch
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 685X8YLYSB
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
      configs:
        # Release (what `archive` builds) signs manually with the App Store profile, like the
        # watch widgets: every embedded binary must carry the same certificate as its parent,
        # and the export re-signs with these same profiles (ios/ExportOptions.plist).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "WingFoil Watch App Store"
    # Same entitlement as the phone, for the same framework. The watch app writes the workout
    # (rings credit) and reads heart rate off the live builder — the only place in this
    # project that reads anything from Health at all, and unavoidable: a live workout builder
    # is the only route to heart rate on the wrist.
    entitlements:
      path: WingFoilWatch/WingFoilWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: WingFoilWatch/Info.plist
      properties:
        CFBundleDisplayName: CleanJibe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Names the phone app this watch app belongs to. Wrong or missing, the watch app
        # installs as a standalone and `WCSession` never finds a counterpart.
        WKCompanionAppBundleIdentifier: de.lahmann.wingfoil
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: false
        # `workout-processing` is what keeps the app running for two hours on a wet wrist in
        # a pocket — the `HKWorkoutSession` is the extended-runtime mechanism, and there is
        # deliberately no `WKExtendedRuntimeSession` beside it (they are alternatives).
        # No `location` under WKBackgroundModes: App Store validation rejects it there
        # (ITMS-90362) — `workout-processing` is the only value that key accepts. That does
        # NOT mean the workout session keeps fixes flowing by itself: since watchOS 4 a
        # wrist-down app gets no location unless `allowsBackgroundLocationUpdates` is true.
        WKBackgroundModes:
          - workout-processing
        # …and THIS is where `location` goes on watchOS: the same UIBackgroundModes key the
        # WatchKit extension carried since watchOS 4. CoreLocation checks it the moment the
        # recorder sets `allowsBackgroundLocationUpdates = true` after the workout starts,
        # and without it the watch app dies right there with NSInternalInconsistencyException
        # "!stayUp || CLClientIsBackgroundable" — which is what build 21's START did (4 Sep
        # 2026, ADR-019). `LocationBridge` also reads this key before setting the flag, so a
        # future edit here degrades to no background fixes instead of a crash.
        UIBackgroundModes:
          - location
        # Real sentences. These are what the rider reads on the watch when the prompt appears,
        # and a placeholder here is both a review rejection and a rudeness.
        NSHealthUpdateUsageDescription: >-
          Saves your wingfoil session to the Health app as a workout, so it counts toward your
          activity rings.
        NSHealthShareUsageDescription: >-
          Reads your heart rate while you ride, so the session CleanJibe sends to your iPhone
          includes it. Nothing else is read, and nothing leaves your devices.
        NSLocationWhenInUseUsageDescription: >-
          Records your track and speed while you ride. CleanJibe uses the watch's GPS only
          during a session you started, and the recording is sent straight to your iPhone.
        NSMotionUsageDescription: >-
          Records wrist motion while you ride, so CleanJibe can measure your pumping and how
          much effort each takeoff cost.
        # How the complication reaches the app. `widgetURL` hands the system this URL, and
        # without the scheme declared here nothing routes it — the tap opens the app to
        # whatever screen it was on and the rider has to press START after all, which is the
        # entire feature gone with no error anywhere. `WatchURL` in ios/WatchShared/ is the
        # single place the string is written; this is the declaration that makes it work.
        CFBundleURLTypes:
          - CFBundleURLName: de.lahmann.wingfoil.watchkitapp.start
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - cleanjibe
        ITSAppUsesNonExemptEncryption: false

  # The watch-face complication (ios/WingFoilWatchWidgets/), embedded in the watch app above.
  #
  # A SEPARATE TARGET BECAUSE WIDGETKIT DEMANDS ONE. A complication is a WidgetKit extension —
  # its own process, its own bundle id, its own `@main` — and there is no way to render one from
  # inside an app target. That is the whole reason this exists as a fourth target rather than a
  # file in `WingFoilWatch`; the Siri intents, which are under no such constraint, deliberately
  # did not get an extension and live in the app (docs/decisions.md ADR-018).
  #
  # NO APP GROUP ENTITLEMENT, for the same reason `WingFoilWidgets` has none: the manual App
  # Store profiles do not carry `group.de.lahmann.wingfoil`, and requesting an entitlement a
  # profile does not grant fails the archive. `WatchLastSessionStore` probes for the container
  # at runtime, so today the complication renders its "Start session" state — which is a fully
  # working launcher, because the launching does not need the group at all. Only the last
  # session's line does. To turn that on: add App Groups to the watch app id and to
  # `de.lahmann.wingfoil.watchkitapp.widgets` in the portal, regenerate both profiles, and add
  # `com.apple.security.application-groups` to both `entitlements` blocks. No code change.
  WingFoilWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WingFoilWatchWidgets
      - path: WatchShared
        group: Shared
    settings:
      base:
        PRODUCT_NAME: WingFoilWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.lahmann.wingfoil.watchkitapp.widgets
        MARKETING_VERSION: "0.15.0"
        CURRENT_PROJECT_VERSION: "26"
        TARGETED_DEVICE_FAMILY: "4"          # Apple Watch
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 685X8YLYSB
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
      configs:
        # Release (what `archive` builds) signs with the App Store profile the orchestrator
        # created via the ASC API. Automatic signing cannot mint a development profile for this
        # bundle id on a Mac with no Xcode account, and the distribution profile is the one the
        # export needs anyway (ios/ExportOptions.plist). Debug stays automatic for the simulator.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "WingFoil Watch Widgets App Store"
    info:
      path: WingFoilWatchWidgets/Info.plist
      properties:
        # What the watch-face complication picker prints above the mark.
        CFBundleDisplayName: CleanJibe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ITSAppUsesNonExemptEncryption: false
